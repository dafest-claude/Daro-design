<text x="427" y="455" font-size="11" fill="#111111" text-anchor="middle" font-weight="bold">ESTAR  /  COMEDOR</text>
<text x="122" y="460" font-size="7" fill="#111111" text-anchor="middle" font-weight="bold" transform="rotate(-90,122,460)">BALCÓN</text>
<text x="775" y="397" font-size="9" fill="#111111" text-anchor="middle">VESTÍBULO</text>

