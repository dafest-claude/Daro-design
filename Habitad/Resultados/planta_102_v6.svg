<text x="296" y="230" font-size="10" fill="#111111" text-anchor="middle" font-weight="bold">DORMITORIO</text>
<text x="511" y="200" font-size="8" fill="#111111" text-anchor="middle">CORREDOR</text>
<text x="651" y="200" font-size="9" fill="#111111" text-anchor="middle" font-weight="bold">BAÑO</text>
